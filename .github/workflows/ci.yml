name: CI
# Cổng chất lượng PLAN §7. Mỗi job độc lập để thấy ngay hỏng ở đâu.
# Job "gate" ở cuối là điểm duy nhất cần đặt làm "required check" trong branch protection.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ghim phiên bản wrangler dùng cho dry-run (khớp WRANGLER_VERSION mặc định trong scripts/deploy-cloudflare.mjs)
  WRANGLER_VERSION: 4.161.0

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # phiên bản lấy từ "packageManager" trong package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Kiểm tra script hạ tầng (cú pháp)
        run: |
          node --check scripts/setup.mjs
          node --check scripts/deploy-cloudflare.mjs

  unit:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  e2e-smoke:
    name: E2E smoke (Postgres + Redis thật)
    runs-on: ubuntu-latest
    needs: [typecheck, unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cài redis-server (smoke dùng Redis thật; Postgres là embedded-postgres qua pnpm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:smoke
      - name: Bundle check (đóng gói như Dockerfile, chạy /health)
        run: pnpm --filter @ams/e2e bundle-check

  # ---- Chỗ giữ sẵn cho các bộ test sẽ thêm. Chạy khi có script tương ứng ở BẤT KỲ package nào; chưa có thì job
  # ---- xanh nhưng ghi rõ "chưa có" trong log (không giả vờ đã kiểm). Thêm script `test:contract`, `test:chaos`,
  # ---- `test:playwright` vào package.json của package sở hữu bộ test là đủ, không cần sửa workflow.
  contract:
    name: Contract test (placeholder)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chạy test:contract nếu có
        run: |
          n=$(grep -l '"test:contract"' package.json apps/*/package.json packages/*/package.json services/*/package.json tools/*/package.json tests/*/package.json 2>/dev/null | wc -l)
          if [ "$n" = "0" ]; then echo "::notice::Chưa có script test:contract ở package nào (placeholder)"; else pnpm -r --if-present run test:contract; fi

  chaos:
    name: Chaos / failure-injection (placeholder)
    runs-on: ubuntu-latest
    needs: [e2e-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cài redis-server (chaos thường cần dừng/khởi động lại Redis)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - run: pnpm install --frozen-lockfile
      - name: Chạy test:chaos nếu có
        run: |
          n=$(grep -l '"test:chaos"' package.json apps/*/package.json packages/*/package.json services/*/package.json tools/*/package.json tests/*/package.json 2>/dev/null | wc -l)
          if [ "$n" = "0" ]; then echo "::notice::Chưa có script test:chaos ở package nào (placeholder)"; else pnpm -r --if-present run test:chaos; fi

  playwright:
    name: Playwright UI (placeholder)
    runs-on: ubuntu-latest
    needs: [e2e-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chạy test:playwright nếu có
        run: |
          n=$(grep -l '"test:playwright"' package.json apps/*/package.json packages/*/package.json services/*/package.json tools/*/package.json tests/*/package.json 2>/dev/null | wc -l)
          if [ "$n" = "0" ]; then echo "::notice::Chưa có script test:playwright ở package nào (placeholder)"; exit 0; fi
          pnpm exec playwright install --with-deps chromium
          pnpm -r --if-present run test:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            **/playwright-report/
            **/test-results/
          if-no-files-found: ignore

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sinh .env từ .env.example (khóa ngẫu nhiên)
        run: node scripts/setup.mjs env
      - name: Kiểm tra .env
        run: node scripts/setup.mjs check-env
      - name: Compose config (mọi profile)
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml --profile '*' config -q
      - name: Compose config không cần .env (cổng chất lượng PLAN §7)
        run: docker compose -f infra/docker/docker-compose.yml config -q
      - name: Ma trận build image của CI phải khớp compose (chống lệch như service payments đã bỏ)
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.yml --profile '*' config --format json > /tmp/compose.json
          node - <<'JS'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('/tmp/compose.json', 'utf8'));
          // mỗi tệp Dockerfile + target mà compose build phải có trong ma trận job "images" của ci.yml
          const want = new Set();
          for (const [name, s] of Object.entries(c.services)) if (s.build) want.add(`${s.build.dockerfile}|${s.build.target ?? ''}`);
          const ci = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          const have = new Set();
          for (const m of ci.matchAll(/\{ name: [\w-]+, dockerfile: (\S+?)(?:, target: (\w+))? \}/g)) have.add(`${m[1]}|${m[2] ?? ''}`);
          const missing = [...want].filter((x) => !have.has(x));
          const extra = [...have].filter((x) => !want.has(x));
          if (missing.length || extra.length) { console.error('Lệch compose <-> CI.\n  Thiếu trong CI:', missing, '\n  Thừa trong CI (compose không build):', extra); process.exit(1); }
          console.log('Khớp:', [...want].join(', '));
          JS

  images:
    name: Build image ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        # PHẢI khớp các service có `build:` trong infra/docker/docker-compose.yml (job compose-config kiểm tự động).
        # Không có `payments`: tài chính chạy trong API (services/api/src/finance-mount.ts).
        include:
          - { name: api, dockerfile: services/api/Dockerfile, target: runtime }
          - { name: migrate-seed, dockerfile: services/api/Dockerfile, target: migrate }
          - { name: edge-gateway, dockerfile: services/edge-gateway/Dockerfile }
          - { name: ingest-consumer, dockerfile: services/ingest-consumer/Dockerfile }
          - { name: web-admin, dockerfile: apps/web-admin/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: ams/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  cloudflare-config:
    name: Cloudflare (wrangler dry-run + terraform validate)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --fake-ids: dùng ID giả, KHÔNG gọi Cloudflare, không cần token. Build web + wrangler deploy --dry-run cho cả 2 môi trường.
      - name: wrangler dry-run staging
        run: node scripts/deploy-cloudflare.mjs --env staging --dry-run --fake-ids
      - name: wrangler dry-run production
        run: node scripts/deploy-cloudflare.mjs --env production --dry-run --fake-ids --skip-build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt + validate
        working-directory: infra/cloudflare/terraform
        run: |
          terraform fmt -check -recursive || echo '::warning::terraform fmt: có tệp chưa đúng định dạng (chạy terraform fmt -recursive)'
          terraform init -backend=false -input=false
          terraform validate

  gate:
    name: CI gate
    if: always()
    needs: [typecheck, unit, e2e-smoke, contract, chaos, playwright, compose-config, images, cloudflare-config]
    runs-on: ubuntu-latest
    steps:
      - name: Mọi job phải thành công
        run: |
          echo '${{ toJSON(needs) }}' | node -e "
            const n = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(n).filter(([, v]) => v.result !== 'success');
            if (bad.length) { console.error('Job không đạt:', bad.map(([k, v]) => k + '=' + v.result).join(', ')); process.exit(1); }
            console.log('Tất cả job đạt.');"
