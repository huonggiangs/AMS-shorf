name: cf-runtime
# Chay Worker THAT (workerd/Miniflare) voi D1 da ap migration 0001-0015. Khong can secret/tai khoan Cloudflare.
on:
  pull_request:
    paths: ['services/**', 'packages/**', 'infra/cloudflare/**', 'tests/cf-runtime/**', 'scripts/deploy-cloudflare.mjs']
  workflow_dispatch:
jobs:
  cf-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cf
