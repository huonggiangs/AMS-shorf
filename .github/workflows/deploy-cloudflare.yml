name: Deploy Cloudflare
# Thủ công (Actions > Run workflow) hoặc khi đẩy tag:
#   v1.2.3-rc.1  -> staging      v1.2.3 -> production
# Secrets cần đặt trong GitHub (Settings > Secrets and variables > Actions, hoặc theo Environment):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   AMS_SECRET_SESSION_SECRET, AMS_SECRET_FIELD_ENC_KEY, AMS_SECRET_SEPAY_WEBHOOK_SECRET (bắt buộc), AMS_SECRET_R2_*, AMS_SECRET_MAIL_* (tùy chọn)
#   Nên đặt theo Environment (staging, production) để hai môi trường dùng giá trị khác nhau. ID tài nguyên do script tự tra qua API.
# Environment "production" nên bật "Required reviewers" để có bước duyệt tay.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Môi trường
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Chạy thử (không deploy thật)
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.event.inputs.environment || 'tag' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (contains(github.ref_name, '-') && 'staging' || 'production') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (contains(github.ref_name, '-') && 'staging' || 'production') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Preflight (token, zone anio.vn, quyền) - chỉ đọc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.mjs --env "$TARGET" --preflight
      - name: Deploy (tạo tài nguyên nếu thiếu, migration, bí mật, deploy, tên miền, smoke)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Bí mật Worker: script chỉ đặt cái còn thiếu trên Worker (không ghi đè). Đặt secret trong Environment tương ứng.
          AMS_SECRET_SESSION_SECRET: ${{ secrets.AMS_SECRET_SESSION_SECRET }}
          AMS_SECRET_FIELD_ENC_KEY: ${{ secrets.AMS_SECRET_FIELD_ENC_KEY }}
          AMS_SECRET_SEPAY_WEBHOOK_SECRET: ${{ secrets.AMS_SECRET_SEPAY_WEBHOOK_SECRET }}
          AMS_SECRET_R2_ACCOUNT_ID: ${{ secrets.AMS_SECRET_R2_ACCOUNT_ID }}
          AMS_SECRET_R2_ACCESS_KEY_ID: ${{ secrets.AMS_SECRET_R2_ACCESS_KEY_ID }}
          AMS_SECRET_R2_SECRET_ACCESS_KEY: ${{ secrets.AMS_SECRET_R2_SECRET_ACCESS_KEY }}
          AMS_SECRET_MAIL_HTTP_URL: ${{ secrets.AMS_SECRET_MAIL_HTTP_URL }}
          AMS_SECRET_MAIL_HTTP_KEY: ${{ secrets.AMS_SECRET_MAIL_HTTP_KEY }}
          AMS_SECRET_MAIL_FROM: ${{ secrets.AMS_SECRET_MAIL_FROM }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/deploy-cloudflare.mjs --env "$TARGET" --yes $DRY
