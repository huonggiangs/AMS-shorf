# Web admin + cổng khách hàng (CÙNG một ứng dụng) trên Cloudflare: Workers Static Assets, không cần mã Worker.
# Production: https://ams.anio.vn      Staging: https://ams-stg.anio.vn
# Build tĩnh: pnpm --filter @ams/web-admin build (VITE_API_BASE=/api) -> apps/web-admin/dist
# /api/* trên cùng host được định tuyến tới Worker `ams-api-*` bằng route khai báo ở infra/cloudflare/api/wrangler.toml
# (route theo đường dẫn cụ thể được ưu tiên hơn custom domain; xem mục rủi ro trong docs/DEPLOY-CLOUDFLARE.md).
# Điều kiện: zone anio.vn nằm trong tài khoản Cloudflare. wrangler tự tạo bản ghi DNS cho custom domain.
name = "ams-web-admin"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../../../apps/web-admin/dist"
not_found_handling = "single-page-application"

[env.staging]
name = "ams-web-admin-staging"
routes = [{ pattern = "ams-stg.anio.vn", custom_domain = true }]

[env.staging.assets]
directory = "../../../apps/web-admin/dist"
not_found_handling = "single-page-application"

[env.production]
name = "ams-web-admin-production"
routes = [{ pattern = "ams.anio.vn", custom_domain = true }]

[env.production.assets]
directory = "../../../apps/web-admin/dist"
not_found_handling = "single-page-application"
