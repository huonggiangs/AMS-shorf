# Worker "api" (Hono): admin API, portal, auth, webhook SePay. Mã nguồn: services/api (điểm vào src/worker.ts).
# - Các chỗ giữ dấu dạng __TÊN__ được scripts/deploy-cloudflare.mjs thay bằng ID thật (từ Terraform/bootstrap) và ghi ra
#   wrangler.generated.toml cùng thư mục. KHÔNG chạy `wrangler deploy` trực tiếp với tệp này.
# - Bí mật (SESSION_SECRET, FIELD_ENC_KEY, SEPAY_WEBHOOK_SECRET, R2_*...) đặt bằng `wrangler secret put`, không ghi ở đây.
# - Tên miền (zone anio.vn phải nằm trong tài khoản Cloudflare): web + /api/* ở ams.anio.vn, gateway ở gw-ams.anio.vn (staging: ams-stg / gw-ams-stg).
#   Custom domain do wrangler tự tạo bản ghi DNS. Worker api nhận đường dẫn có tiền tố /api (xem ops/agents/f2-infra.requests.md).
# - Binding KHÔNG kế thừa giữa các môi trường, nên mỗi [env.*] khai báo đủ.
# - Migration D1 dùng chung nguồn packages/db/migrations (áp bằng `wrangler d1 migrations apply`).
name = "ams-api"
main = "../../../services/api/src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[env.staging]
name = "ams-api-staging"
routes = [{ pattern = "ams-stg.anio.vn/api/*", zone_name = "anio.vn" }]  # /api/* của web; Worker nhận đường dẫn CÓ tiền tố /api

[env.staging.vars]
RUNTIME = "cloudflare"
ENVIRONMENT = "staging"
SEPAY_MODE = "sandbox"
PUBLIC_ADMIN_URL = "https://ams-stg.anio.vn"
PUBLIC_API_URL = "https://ams-stg.anio.vn/api"
PUBLIC_GATEWAY_URL = "https://gw-ams-stg.anio.vn"
SEPAY_WEBHOOK_URL = "https://ams-stg.anio.vn/api/webhooks/payments/sepay"
APP_PUBLIC_URL = "https://ams-stg.anio.vn"
PORTAL_PUBLIC_URL = "https://ams-stg.anio.vn"
API_PUBLIC_URL = "https://ams-stg.anio.vn/api"
API_BASE_PATH = "/api"
S3_BUCKET = "ams-media-staging"
LOG_LEVEL = "info"

[[env.staging.d1_databases]]
binding = "DB_CORE"
database_name = "ams-core-staging"
database_id = "__D1_CORE_ID__"
migrations_dir = "../../../packages/db/migrations"

[[env.staging.d1_databases]]
binding = "DB_FINANCE"
database_name = "ams-finance-staging"
database_id = "__D1_FINANCE_ID__"

[[env.staging.d1_databases]]
binding = "DB_AUDIT"
database_name = "ams-audit-staging"
database_id = "__D1_AUDIT_ID__"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "ams-media-staging"

[[env.staging.r2_buckets]]
binding = "REPORTS"
bucket_name = "ams-reports-staging"

[[env.staging.r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "ams-audit-staging"

[[env.staging.queues.producers]]
binding = "JOBS_QUEUE"
queue = "ams-jobs-staging"

[[env.staging.queues.consumers]]
queue = "ams-jobs-staging"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "ams-jobs-dlq-staging"

[[env.staging.durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceShard"
script_name = "ams-edge-gateway-staging"

[env.staging.triggers]
# đối soát bù SePay mỗi 10 phút + đối soát doanh thu/impression 02:15 UTC hằng ngày
crons = ["*/10 * * * *", "15 2 * * *"]

[env.production]
name = "ams-api-production"
routes = [{ pattern = "ams.anio.vn/api/*", zone_name = "anio.vn" }]  # /api/* của web; Worker nhận đường dẫn CÓ tiền tố /api

[env.production.vars]
RUNTIME = "cloudflare"
ENVIRONMENT = "production"
SEPAY_MODE = "production"
PUBLIC_ADMIN_URL = "https://ams.anio.vn"
PUBLIC_API_URL = "https://ams.anio.vn/api"
PUBLIC_GATEWAY_URL = "https://gw-ams.anio.vn"
SEPAY_WEBHOOK_URL = "https://ams.anio.vn/api/webhooks/payments/sepay"
APP_PUBLIC_URL = "https://ams.anio.vn"
PORTAL_PUBLIC_URL = "https://ams.anio.vn"
API_PUBLIC_URL = "https://ams.anio.vn/api"
API_BASE_PATH = "/api"
S3_BUCKET = "ams-media-production"
LOG_LEVEL = "info"

[[env.production.d1_databases]]
binding = "DB_CORE"
database_name = "ams-core-production"
database_id = "__D1_CORE_ID__"
migrations_dir = "../../../packages/db/migrations"

[[env.production.d1_databases]]
