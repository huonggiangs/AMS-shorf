transform="translate(-100, -54)"><foreignObject width="200" height="108"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>dual-write 2 tuần,<br />cắt 1% → 10% → 50% → 100%,<br />luôn có đường quay lui</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-L-0" data-look="classic" transform="translate(138, 171.5)"><rect class="basic label-container" style="" x="-130" y="-136.5" width="260" height="273"/><g class="label" style="" transform="translate(-100, -121.5)"><rect/><foreignObject width="200" height="243"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>1. Docker local trên PC</b><br />Hono trên Node<br />PostgreSQL 16 + Redis<br />MinIO + Mailpit<br />Redpanda + ClickHouse (profile events)<br />Dùng: phát triển, nghiệm thu,<br />10-50 nghìn thiết bị ảo</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-1" data-look="classic" transform="translate(636.125, 171.5)"><rect class="basic label-container" style="" x="-130" y="-150" width="260" height="300"/><g class="label" style="" transform="translate(-100, -135)"><rect/><foreignObject width="200" height="270"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>2. Cloudflare</b><br />Workers Hono<br />D1 + KV<br />Durable Objects (presence)<br />Queues / Pipelines<br />R2 + Analytics Engine<br />Dùng: bản chạy thật đầu tiên,<br />mục tiêu 1-3 triệu thiết bị</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-K-2" data-look="classic" transform="translate(1151.125, 171.5)"><rect class="basic label-container" style="" x="-130" y="-163.5" width="260" height="327"/><g class="label" style="" transform="translate(-100, -148.5)"><rect/><foreignObject width="200" height="297"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>3. Hạ tầng riêng</b><br />Gateway Go + L4 LB nhiều vùng<br />PostgreSQL + replica, Redis Cluster<br />Redpanda + ClickHouse<br />S3 tương thích<br />Cloudflare giữ CDN, WAF, DNS, media<br />Dùng: 10 triệu thiết bị trở lên</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient></svg>