components:
  schemas:
    ActivationLog:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type:
                  - string
                  - number
              customer_id:
                type:
                  - string
                  - "null"
              trigger_topup_id:
                type:
                  - string
                  - "null"
              actions:
                type: array
                items: {}
                default: []
              created_at:
                type:
                  - string
                  - "null"
            required:
              - id
            additionalProperties: true
      required:
        - items
      additionalProperties: true
    AdminPatchMediaByIdRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
            - type: string
              maxLength: 1000
            - type: "null"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 10
        duration_sec:
          type: integer
          minimum: 1
          maximum: 3600
        customer_id:
          type: string
          maxLength: 64
        source_url:
          type: string
          minLength: 8
          maxLength: 2048
      additionalProperties: false
    AdminPostBroadcastInsightsRecommendRequest:
      type: object
      properties:
        place:
          type: string
          enum:
            - building
            - office
            - hospital
            - school
            - mall
            - restaurant
            - street
            - home
            - other
          default: other
        hour:
          type: integer
          minimum: 0
          maximum: 23
        audience:
          type: string
          enum:
            - child
            - teen
            - adult
            - senior
            - mixed
          default: mixed
        density:
          type: string
          enum:
            - low
            - medium
            - high
          default: medium
        weather:
          type: string
          enum:
            - any
            - sunny
            - rain
            - hot
            - cold
          default: any
        note:
          type: string
          maxLength: 200
          default: ""
      additionalProperties: true
    AdminPostBroadcastNoticeRequest:
      type: object
      properties:
        text:
          type: string
