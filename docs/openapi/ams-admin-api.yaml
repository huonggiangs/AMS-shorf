openapi: 3.1.0
info:
  title: AMS - Admin / Customer API
  version: 0.1.0
  summary: API quản trị + cổng khách hàng + webhook thanh toán của hệ thống quản lý quảng cáo AMS
  description: |-
    File này được SINH TỰ ĐỘNG (`pnpm --filter @ams/openapi generate`); không sửa tay. `pnpm --filter @ams/openapi check` báo lỗi khi file lệch khỏi route/zod thật.

    Nguồn: danh sách route lấy từ ứng dụng Hono thật (`createApp` + `mountFinanceRoutes`); body request trích từ zod thật trong `services/api` và `services/payments`; schema phản hồi lấy từ `apps/web-admin/src/api/schemas.ts` (hợp đồng phía client, dạng *input*; `additionalProperties: true` nghĩa là có thể có thêm trường).

    Xác thực: cookie `ams_session` (HttpOnly, SameSite=Lax) + header `X-CSRF-Token` cho phương thức ghi. Lỗi: `{ "error": { "code", "message", "details"? } }`.
    Số tiền luôn là số nguyên đồng (VND), không dùng số thực.

    ## TODO (p0-domain): chưa có trong tài liệu này
    Trạng thái chiến dịch mới, outbox, chi tiêu (p0-domain đang bổ sung). Lệnh thiết bị phía admin (tạo/liệt kê/huỷ `device_commands`) đã có: `/admin/v1/devices/{id}/commands` (w-dev). Khi route mới xuất hiện, `check` sẽ báo lệch, chạy lại `generate`.
servers:
  - url: http://api.ams.localhost
    description: Docker local (Caddy)
  - url: http://localhost:8787
    description: API trực tiếp (dev)
