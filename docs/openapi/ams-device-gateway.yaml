          items:
            type: string
            pattern: ^[a-z][a-z0-9_.-]{0,29}$
          maxItems: 24
      required:
        - pubkey
      additionalProperties: true
    RegisterResponse:
      type: object
      properties:
        device_id:
          type: string
        trust_level:
          type: integer
        attestation_nonce:
          type: string
        server_time:
          type: string
          format: date-time
        protocol:
          type: integer
        heartbeat_interval:
          type: integer
          description: giay
        created:
          type: boolean
          description: true => 201 (thiet bi moi), false => 200 (da dang ky truoc)
      required:
        - device_id
        - trust_level
        - attestation_nonce
        - server_time
        - protocol
        - heartbeat_interval
        - created
      additionalProperties: true
    TaxAuthRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
        consent_version:
          type: string
          minLength: 1
          maxLength: 20
        tax_code:
          type: string
          pattern: ^\d{10}(-?\d{3})?$
      required:
        - mode
        - consent_version
      additionalProperties: true
    TaxAuthResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
        tax_authorization:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
          description: trung mode, ten truong cua app Mindo
        consent_version:
          type:
            - string
            - "null"
        updated_at:
          type:
            - string
            - "null"
        current_consent_version:
          type: string
        modes:
          type: array
          items:
            type: string
        remittance_active:
          type: boolean
          const: false
          description: CHUA khau tru/nop thue that
      required:
        - mode
        - tax_authorization
        - consent_version
        - updated_at
        - current_consent_version
        - modes
        - remittance_active
      additionalProperties: true
    ViewerPairRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
        - code
      additionalProperties: true
    ViewerPairResponse:
      type: object
      properties:
        paired:
          type: boolean
          const: true
        device_id:
          type: string
          description: device_id cua TV vua ghep
        trust_level:
          type: integer
        already:
          type: boolean
      required:
        - paired
        - device_id
        - trust_level
      additionalProperties: true
    ViewerPhoneOtp:
      type: object
      properties:
        otp_sent:
          type: boolean
          const: true
        expires_in:
          type: integer
        phone_masked:
          type: string
        dev_otp:
          type: string
          description: CHI local/test khi VIEWER_OTP_DEV_ECHO=1
      required:
        - otp_sent
        - expires_in
        - phone_masked
      additionalProperties: true
    ViewerPhoneRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: ^(\+84|0)\d{9}$
        otp:
          type: string
          pattern: ^\d{6}$
      required:
        - phone
      additionalProperties: true
    ViewerPhoneVerified:
      type: object
      properties:
        verified:
          type: boolean
          const: true
        phone_masked:
          type: string
      required:
        - verified
        - phone_masked
      additionalProperties: true
    WalletResponse:
      type: object
      properties:
        paired:
          type: boolean
        balance_vnd:
          type: integer
          description: so du KHA DUNG = so cai - lenh rut dang cho
        ledger_balance_vnd:
          type: integer
        pending_payout_vnd:
          type: integer
        total_paid_vnd:
          type: integer
        views:
          type: integer
          description: so luot xem DA CO THUONG (chien dich phu)
        interactions:
          type: integer
          description: so tuong tac DA CO THUONG
        payouts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              amount_vnd:
                type: integer
              status:
                type: string
                enum:
                  - pending
                  - paid
                  - rejected
              requested_at:
                type: string
              paid_at:
                type:
                  - string
                  - "null"
            required:
              - id
              - amount_vnd
              - status
              - requested_at
              - paid_at
            additionalProperties: true
        devices:
          type: array
          items:
            type: object
            properties:
              device_id:
                type: string
              name:
                type:
                  - string
                  - "null"
              paired_at:
                type:
                  - string
                  - "null"
            required:
              - device_id
              - name
              - paired_at
            additionalProperties: true
        tax_mode:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
        tax_authorization:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
          description: trung tax_mode, ten truong cua app Mindo
        phone_verified:
          type: boolean
        today_reward_vnd:
          type: integer
        unit_price_vnd:
          type: integer
          description: don gia chi de hien thi (20 d)
        payout_threshold_vnd:
          type: integer
          description: moc nhan thuong cong don (mac dinh 100000)
        interaction_reward_range_vnd:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
        daily_reward_cap_vnd:
          type: integer
        withdraw_enabled:
          type: boolean
          description: false => POST /v1/withdraw tra feature_disabled
      required:
        - paired
        - balance_vnd
        - ledger_balance_vnd
        - pending_payout_vnd
        - total_paid_vnd
        - views
        - interactions
        - payouts
        - devices
        - tax_mode
        - tax_authorization
        - phone_verified
        - unit_price_vnd
        - payout_threshold_vnd
        - interaction_reward_range_vnd
        - daily_reward_cap_vnd
        - withdraw_enabled
      additionalProperties: true
    WithdrawRequest:
      type: object
      properties:
        amount_vnd:
          type: integer
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000000000
        bank:
          type: object
          properties:
            bank_code:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,20}$
            bank_name:
              type: string
              minLength: 2
              maxLength: 80
            account_number:
              type: string
              pattern: ^[0-9A-Za-z]{4,30}$
            account_name:
              type: string
              minLength: 2
              maxLength: 80
          required:
            - bank_name
            - account_number
            - account_name
          additionalProperties: true
        otp:
          type: string
          pattern: ^\d{6}$
        tax_authorization:
          type: string
          enum:
            - none
            - auto_pay
            - delegate
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
      required:
        - amount_vnd
        - bank
        - idempotency_key
      additionalProperties: true
    WithdrawResponse:
      type: object
      properties:
        payout_id:
          type: string
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - paid
            - rejected
        amount_vnd:
          type: integer
        requested_at:
          type: string
        review:
          type: string
          const: awaiting_finance_approval
        idempotent_replay:
          type: boolean
          description: true => 200, tra lai lenh cu theo idempotency_key
      required:
        - payout_id
        - id
        - status
        - amount_vnd
        - requested_at
        - review
      additionalProperties: true
  responses:
    Error:
      description: "Lỗi: luôn có dạng { error: { code, message, details? } }"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    RetryLater:
      description: "Quá tải hoặc quá giới hạn: chờ `Retry-After` giây rồi thử lại"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  securitySchemes:
    deviceSignature:
      type: apiKey
      in: header
      name: x-signature
      description: Ed25519 trên METHOD\nPATH?QUERY\nTIMESTAMP\nNONCE\nSHA256(body); kèm X-Device-Id, X-Timestamp, X-Nonce.
