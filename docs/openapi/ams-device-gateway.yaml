openapi: 3.1.0
info:
  title: AMS - Device Gateway API
  version: 0.1.0-protocol.1
  summary: Giao thức thiết bị (TV/thang máy/LED) <-> edge gateway
  description: |-
    File SINH TỰ ĐỘNG từ gateway thật (route Hono + zod trong `services/edge-gateway/src/protocol.ts`). Mô tả văn xuôi: docs/DEVICE-PROTOCOL.md.

    ## Chữ ký thiết bị (Ed25519)
    Mỗi request (trừ /health và /v1/manifest/g/{group}) mang 4 header: `x-device-id`, `x-timestamp`, `x-nonce`, `x-signature`.
    Chuỗi ký (UTF-8, nối bằng `\n`): `METHOD\nPATH?QUERY\nTIMESTAMP\nNONCE\nSHA256_HEX(body)`; body rỗng => sha256 của chuỗi rỗng. `PATH?QUERY` đúng như gửi trên đường truyền.
    Lệch đồng hồ > 300s => 401 `stale_timestamp`; nonce dùng lại => 409 `replay`.

    ## Lỗi
    Mã: `bad_request` (400), `invalid_signature` (401), `stale_timestamp` (401), `unknown_device` (401), `device_blocked` (403), `device_deleted` (410), `replay` (409), `payload_too_large` (413), `validation_failed` (422), `rate_limited` (429), `overloaded` (503), `not_found` (404), `internal` (500), `forbidden` (403), `feature_disabled` (403), `otp_required` (403), `otp_invalid` (403), `phone_not_verified` (403), `tax_consent_required` (403), `invalid_code` (404), `already_paired` (409), `conflict` (409), `insufficient_balance` (409), `idempotency_conflict` (409), `below_threshold` (422), `not_configured` (503). 429/503 kèm `Retry-After` (đã jitter): thiết bị PHẢI chờ đúng giá trị đó.

    ## TODO (p0-domain): chưa có trong tài liệu này
    Lệnh admin tạo/xem/huỷ qua `/admin/v1/devices/{id}/commands` (xem tài liệu admin API); loại lệnh mới do p0-domain bổ sung (nếu có). `/v1/commands/ack` và `commands[]` của heartbeat (bảng `device_commands`) đã có và được sinh từ mã; xem docs/DEVICE-PROTOCOL.md mục 6. Khi p0 thêm route, `check` báo lệch; chạy lại `generate`.
servers:
  - url: http://gw.ams.localhost
    description: Docker local (Caddy)
  - url: http://localhost:8788
    description: Gateway trực tiếp (dev)
tags:
  - name: device
    description: Thiết bị đã ký
  - name: system
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - system
      security: []
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Sức khỏe dịch vụ
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/commands/ack:
    post:
      operationId: gatewayPostCommandsAck
      tags:
        - device
      security: &a1
        - deviceSignature: []
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Báo kết quả lệnh
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandAckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAckResponse"
        "401": &a2
          $ref: "#/components/responses/Error"
        "403": &a3
          $ref: "#/components/responses/Error"
        "409": &a4
          $ref: "#/components/responses/Error"
        "413": &a5
          $ref: "#/components/responses/Error"
        "422": &a6
          $ref: "#/components/responses/Error"
        "429": &a7
          $ref: "#/components/responses/RetryLater"
        "503": &a8
          $ref: "#/components/responses/RetryLater"
  /v1/commands/wait:
    get:
      operationId: gatewayGetCommandsWait
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Long-poll lệnh (tin khẩn thời gian thực)
      description: Giữ kết nối tối đa `timeout` giây (1–25, mặc định 25) và trả ngay khi có lệnh pending (kiểm cờ hàng đợi mỗi ~1,5 giây). Lệnh giao at-least-once như heartbeat; ack qua /v1/commands/ack. Giới hạn 600 lần/giờ/thiết bị (429 + `Retry-After`). Thiết bị vẫn heartbeat định kỳ.
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
        - name: timeout
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: Danh sách lệnh (rỗng nếu hết thời gian chờ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items:
                      type: object
                  waited:
                    type: boolean
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/events:
    post:
      operationId: gatewayPostEvents
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Gửi lô sự kiện (tối đa 50, idempotent theo event_id)
      description: "Thân tối đa 16 KB. Impression hợp lệ khi vcr_pct >= ngưỡng; sự kiện không có trong manifest bị từ chối từng cái (`rejected`). `proof_of_play` (thang máy/LED): thiết bị đã được cấp quyền => hợp lệ (`valid`); chưa cấp quyền => vẫn lưu với trạng thái `pending_trust` (đếm vào `flagged`, không bị loại, tính lại khi được cấp quyền); không bao giờ sinh doanh thu/thưởng ở gateway."
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsRequest"
      responses:
        "202":
          description: Đã nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/heartbeat:
    post:
      operationId: gatewayPostHeartbeat
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Nhịp sống + nhận lệnh
      description: Thân tối đa 2 KB. Trả khoảng nghỉ kế tiếp có jitter, etag manifest và lệnh đang chờ (giao at-least-once; xác nhận qua `cmd_ack` hoặc /v1/commands/ack). 429/503 kèm `Retry-After`. Thang máy/LED có thể gửi `source` (ams|usb|lan), `app_version`, `cache_mb`, `px_w`/`px_h`/`orientation`/`region` (tùy chọn); nhận thêm `hotline`, `app_update_url`, `app_update_sha256`, `min_app_version` khi có cấu hình.
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/interactions:
    post:
      operationId: gatewayPostInteractions
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Báo tương tác (nhấp / quét QR), tối đa 10 sự kiện/lô, khử trùng theo event_id
      description: "Xác thực bằng chữ ký thiết bị (phone hoặc tv, đã ghép: trust_level >= 1). Thưởng = `interaction_reward_vnd` của chiến dịch (tối đa `INTERACTION_MAX_REWARD_VND`=50), ghi `wallet_ledger` bất biến, một lần theo event_id. Giới hạn: 20 lô/phút/thiết bị, 30 tương tác/người/ngày, 3/chiến dịch/người/ngày, trần thưởng/ngày. Gửi lại event_id => `duplicate` (không cộng lại). Sự kiện từ chối nằm ở `rejected` (vd `untrusted_device`, `not_in_manifest`, `campaign_cap`)."
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionsRequest"
      responses:
        "200":
          description: Đã xử lý
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionsResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/logs:
    post:
      operationId: gatewayPostLogs
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Gửi nhật ký thiết bị (Signage Player)
      description: Thân tối đa 8 KB, tối đa 100 dòng. Giới hạn tần suất theo device_id (mặc định 60 lần/giờ, 5000 dòng/ngày; 429 + `Retry-After`). `ts` quá cũ bị kẹp về mốc 7 ngày, tương lai kẹp +5 phút. Lưu 7 ngày; quản trị xem ở ngăn chi tiết thiết bị.
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsRequest"
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/manifest:
    get:
      operationId: gatewayGetManifest
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Manifest của thiết bị (đầy đủ hoặc delta)
      description: "Điều kiện: `If-None-Match`/`?etag=` trùng => 304. `?delta=1&etag=<base>` => bản delta nếu còn. Header `X-Manifest-Kind: full|delta`. Thiết bị PHẢI kiểm `sha256` từng creative trước khi phát."
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
        - name: daypart
          in: query
          schema:
            type: string
            pattern: ^[a-z_]{1,16}$
        - name: etag
          in: query
          schema:
            type: string
        - name: delta
          in: query
          schema:
            type: string
            enum:
              - "1"
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Manifest
          headers:
            ETag:
              schema:
                type: string
            X-Manifest-Kind:
              schema:
                type: string
                enum:
                  - full
                  - delta
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Manifest"
                  - $ref: "#/components/schemas/ManifestDelta"
        "304":
          description: Không đổi
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/manifest/g/{group}:
    get:
      operationId: gatewayGetManifestGByGroup
      tags:
        - device
      security: []
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Manifest công khai theo nhóm (cache CDN)
      description: Không cần chữ ký; tắt bằng `MANIFEST_PUBLIC=0`. `group` lấy từ `manifest_group` của heartbeat.
      parameters:
        - name: etag
          in: query
          schema:
            type: string
        - name: delta
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: Manifest
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Manifest"
                  - $ref: "#/components/schemas/ManifestDelta"
        "304":
          description: Không đổi
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/RetryLater"
  /v1/pair:
    post:
      operationId: gatewayPostPair
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Xin mã ghép đôi 6 số / hỏi trạng thái ghép đôi
      description: Body rỗng. Hiển thị `code` trên TV; người dùng nhập vào app điện thoại (API khách gọi `redeemPairingCode`).
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      responses:
        "200":
          description: paired=true hoặc mã mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/register:
    post:
      operationId: gatewayPostRegister
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Đăng ký thiết bị (idempotent theo pubkey)
      description: Ký bằng chính khóa riêng tương ứng `pubkey` trong body (không có X-Device-Id). Trả `attestation_nonce` để kiểm chứng. Giới hạn theo IP. Cùng `pubkey` LUÔN nhận lại cùng `device_id` (200). Thang máy/LED gửi thêm `px_w`, `px_h`, `orientation`, `region` để vào đúng nhóm manifest `elevator_<w>x<h>`; chờ vận hành cấp quyền trên admin (không dùng mã 6 số).
      parameters:
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Đã đăng ký trước đó
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "201":
          description: Thiết bị mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
  /v1/tax-authorization:
    get:
      operationId: gatewayGetTaxAuthorization
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Chế độ thuế hiện tại của người nhận chi trả
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxAuthResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
