    post:
      operationId: gatewayPostWithdraw
      tags:
        - device
      security: *a1
      x-ams-source: services/edge-gateway/src/gateway.ts
      summary: Yêu cầu rút thưởng (tạo lệnh CHỜ tài chính duyệt, KHÔNG tự chuyển tiền)
      description: |-
        Điều kiện: bật `VIEWER_WITHDRAW_ENABLED=1` (mặc định tắt => 403 `feature_disabled`), đã xác minh điện thoại, đã chọn chế độ thuế (nếu `PAYOUT_REQUIRE_TAX_CONSENT`; có thể gửi kèm `tax_authorization` trong chính yêu cầu rút, tương thích app Mindo), `amount_vnd >= PAYOUT_THRESHOLD_VND` (100.000) và <= số dư khả dụng, không có lệnh rút nào đang chờ.

        OTP: gọi lần đầu KHÔNG có `otp` => 403 `otp_required` (và gửi OTP tới số đã xác minh); gọi lại cùng thân kèm `otp`. OTP gắn với đúng số tiền + tài khoản nhận.

        Idempotent theo `idempotency_key` (8-64 ký tự): gửi lại cùng khóa => 200 trả lệnh cũ (không cần OTP mới); cùng khóa khác nội dung => 409 `idempotency_conflict`.

        Tài khoản nhận lưu mã hóa AES-GCM; nhân viên tài chính duyệt/chi ở `/admin/v1/payouts/{id}/pay|reject`.
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
          description: device_id từ /v1/register
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: integer
          description: epoch giây; lệch máy chủ tối đa 300s
        - name: x-nonce
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          description: dùng một lần (chống phát lại)
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{86}$
          description: Ed25519, base64url không padding (64 byte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          description: Lệnh cũ (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "201":
          description: Đã tạo lệnh chờ duyệt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "401": *a2
        "403": *a3
        "409": *a4
        "413": *a5
        "422": *a6
        "429": *a7
        "503": *a8
components:
  schemas:
    CommandAckRequest:
      type: object
      properties:
        acks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 40
              status:
                type: string
                enum:
                  - ok
                  - failed
                default: ok
              result:
                type: string
                maxLength: 500
            required:
              - id
            additionalProperties: true
          minItems: 1
          maxItems: 20
      required:
        - acks
      additionalProperties: true
    CommandAckResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        acked:
          type: integer
        known:
          type: integer
        unknown:
          type: array
          items:
            type: string
          description: id khong thuoc thiet bi nay (bo qua, khong loi)
      required:
        - ok
        - acked
        - known
        - unknown
      additionalProperties: true
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: snake_case, vd validation_error, forbidden, not_found, invalid_state
            message:
              type: string
              description: Tiếng Việt cho người dùng
            details: {}
          required:
            - code
            - message
      required:
        - error
    EventsRequest:
      type: object
      properties:
        events:
          type: array
          items:
            anyOf:
              - type: object
                properties:
                  type:
                    type: string
                    const: impression
                  event_id:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  ts:
                    type: string
                    format: date-time
                  campaign_id:
                    type: string
                    minLength: 1
                    maxLength: 40
                  creative_id:
                    type: string
                    minLength: 1
                    maxLength: 40
                  slot_id:
                    type: string
                    maxLength: 40
                  vcr_pct:
                    type: integer
                    minimum: 0
                    maximum: 100
                  played_ms:
                    type: integer
                    minimum: 0
                    maximum: 3600000
                required:
                  - type
                  - event_id
                  - ts
                  - campaign_id
                  - creative_id
                  - vcr_pct
                  - played_ms
                additionalProperties: true
              - type: object
                properties:
                  type:
                    type: string
                    const: proof_of_play
                  event_id:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  ts:
                    type: string
                    format: date-time
                  creative_id:
                    type: string
                    minLength: 1
                    maxLength: 40
                  duration_ms:
                    type: integer
                    minimum: 0
                    maximum: 3600000
                required:
                  - type
                  - event_id
                  - ts
                  - creative_id
                  - duration_ms
                additionalProperties: true
              - type: object
                properties:
                  type:
                    type: string
                    const: item_impression
                  log_id:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  program_id:
                    type: string
                    minLength: 1
                    maxLength: 64
                  zone_id:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{1,32}$
                  item_id:
                    type: string
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                  media_id:
                    type: string
                    minLength: 1
                    maxLength: 64
                  item_type:
                    type: string
                    enum:
                      - video
                      - image
                      - text
                  played_at:
                    type: string
                    format: date-time
                required:
                  - type
                  - log_id
                  - program_id
                  - zone_id
                  - item_id
                  - item_type
                  - played_at
                additionalProperties: true
          minItems: 1
          maxItems: 50
      required:
        - events
      additionalProperties: true
    EventsResponse:
      type: object
      properties:
        accepted:
          type: integer
        valid:
          type: integer
        flagged:
          type: integer
        rejected:
          type: array
          items:
            type: object
            properties:
              event_id:
                type:
                  - string
                  - "null"
              reason:
                type: string
            required:
              - event_id
              - reason
            additionalProperties: true
      required:
        - accepted
        - valid
        - flagged
        - rejected
      additionalProperties: true
    GenericObject:
      type: object
      additionalProperties: true
    Health:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
        runtime:
          type: string
        time:
          type: string
      required:
        - ok
        - service
        - runtime
      additionalProperties: true
    HeartbeatRequest:
      type: object
      properties:
        state:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        app_ver:
          type: string
          maxLength: 20
        soc_temp:
          type: integer
          minimum: -40
          maximum: 150
        rssi:
          type: integer
          minimum: -120
          maximum: 0
        dl_mbps:
          type: number
          minimum: 0
          maximum: 100000
        cache_used_mb:
          type: integer
          minimum: 0
        cache_slots:
          type: integer
          minimum: 0
        manifest_etag:
          type: string
          maxLength: 64
        cmd_ack:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 20
        app_version:
          type: string
          maxLength: 20
        cache_mb:
          type: integer
          minimum: 0
          maximum: 100000000
        source:
          type: string
          enum:
            - ams
            - usb
            - lan
        px_w:
          type: integer
          minimum: 64
          maximum: 16384
        px_h:
          type: integer
          minimum: 64
          maximum: 16384
        orientation:
          type: string
          enum:
            - landscape
            - portrait
        region:
          type: string
          pattern: ^[A-Za-z0-9_-]{0,16}$
        volume:
          type: integer
          minimum: 0
          maximum: 100
        caps:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_.-]{0,29}$
          maxItems: 24
      additionalProperties: true
    HeartbeatResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        server_time:
          type: string
          format: date-time
        next_interval:
          type: number
          description: giay, da cong jitter
        interval_base:
          type: number
        manifest_etag:
          type: string
        manifest_group:
          type: string
        manifest_url:
          type: string
          description: duong tuong doi /v1/manifest/g/{group}
        commands:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: id dong trong bang device_commands
              type:
                type: string
                pattern: ^[a-z][a-z0-9_.-]{0,39}$
                description: "refresh_manifest, reboot, set_monitor; Signage Player: reset_pin (args rong), set_volume {percent 0-100}, set_orientation {orientation landscape|portrait}, message {text <= 200, duration_s? 3-120}; TV: lock, unlock, message {text, seconds}... Type la: bo qua nhung VAN ack."
              args:
                type: object
                additionalProperties: {}
            required:
              - id
              - type
            additionalProperties: true
            description: "Vong doi: pending -> delivered -> acked|failed, hoac expired (TTL mac dinh 1 gio theo admin, toi da 7 ngay; reset_pin mac dinh 15 phut, toi da 1 gio). Giao lai sau 120s neu chua ack, toi da 10 lan giao; `id` KHONG DOI khi giao lai. At-least-once: thiet bi phai idempotent theo id."
          description: lenh cho thiet bi, giao at-least-once; ack bang cmd_ack trong heartbeat ke tiep hoac POST /v1/commands/ack
        min_app_version:
          type: string
        hotline:
          type: string
          maxLength: 60
          description: "CHI thang may/LED, khi co cau hinh: hotline/Zalo hien o man hinh logo (luu de hien ca khi mat mang)"
        app_update_url:
          type: string
          description: "CHI thang may/LED, khi co cau hinh: URL HTTPS tai ban cap nhat app (di kem app_update_sha256)"
        app_update_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hex cua tep cap nhat; app PHAI kiem truoc khi cai
      required:
        - ok
        - server_time
        - next_interval
        - interval_base
        - manifest_etag
        - manifest_group
        - manifest_url
        - commands
      additionalProperties: true
    InteractionsRequest:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                const: interaction
              event_id:
                type: string
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              ts:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                  - tap
                  - qr_scan
              interaction:
                type: string
                enum:
                  - tap
                  - qr_scan
              campaign_id:
                type: string
                minLength: 1
                maxLength: 40
              creative_id:
                type: string
                minLength: 1
                maxLength: 40
              slot_id:
                type: string
                maxLength: 40
            required:
              - event_id
              - ts
              - campaign_id
              - creative_id
            additionalProperties: true
          minItems: 1
          maxItems: 10
      required:
        - events
      additionalProperties: true
    InteractionsResponse:
      type: object
      properties:
        accepted:
          type: integer
        valid:
          type: integer
        credited_vnd:
          type: integer
        rejected:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
              reason:
                type: string
            required:
              - event_id
              - reason
            additionalProperties: true
        results:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
              status:
                type: string
                enum:
                  - credited
                  - recorded
                  - duplicate
                  - rejected
              credited_vnd:
                type: integer
              reason:
                type: string
            required:
              - event_id
              - status
              - credited_vnd
            additionalProperties: true
      required:
        - accepted
        - valid
        - credited_vnd
        - rejected
        - results
      additionalProperties: true
    LedgerResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                type: string
              amount_vnd:
                type: integer
              status:
                type: string
              created_at:
                type: string
              ref_type:
                type:
                  - string
                  - "null"
            required:
              - id
              - kind
              - amount_vnd
