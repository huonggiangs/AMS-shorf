# Dong bo voi public/_headers (Cloudflare). Duoc include trong nginx.conf.template.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
    # HSTS: chi co y nghia khi qua HTTPS (Caddy/Cloudflare); trinh duyet bo qua tren HTTP local.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP (giu dong bo voi public/_headers): script chi 'self'; media/anh co the den tu Caddy cuc bo (:9000) hoac R2; QR SePay qua https:
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:9000; media-src 'self' blob: https: http://localhost:9000; connect-src 'self' https: http://localhost:9000; font-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
